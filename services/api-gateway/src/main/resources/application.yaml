server:
  port: 8080
  max-http-request-header-size: 16KB
spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/auth/**,/api/github/**,/api/users/**
            - id: workspace-service
              uri: ${WORKSPACE_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/workspace/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8095}
              predicates:
                - Path=/api/ws/**,/api/notify/**
            - id: agent-service
              uri: ${AGENT_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/api/agent/**
  config:
    import: optional:file:.env[.properties], optional:file:services/api-gateway/.env[.properties]
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
