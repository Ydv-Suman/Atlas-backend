server:
  port: 8083

spring:
  application:
    name: agent-service
  config:
    import: optional:file:.env[.properties],optional:file:services/agent-service/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlas_agent_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}

atlas:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
  workspace-service:
    url: ${WORKSPACE_SERVICE_URL:http://localhost:8095}
  github-service:
    url: ${GITHUB_SERVICE_URL:http://localhost:8085}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
