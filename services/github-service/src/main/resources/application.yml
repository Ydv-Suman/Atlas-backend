server:
  port: 9000

spring:
  application:
    name: github-service
  config:
    import: optional:file:.env[.properties],optional:file:services/github-service/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true

  mvc:
    versioned-api:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-uri: http://localhost:9000/api/github/callback
    scopes: repo,read:user,workflow
  encryption:
    key: ${ENCRYPTION_KEY}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8090}
