server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:file:.env[.properties],optional:file:services/auth-service/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
