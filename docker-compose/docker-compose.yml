services:
  redis:
    image: redis:8.2.7
    container_name: "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:6379:6379"
    extends:
      file: common-config.yml
      service: network-deploy-service

  atlasauthservice:
    image: "sumanydv/atlas-auth-service:v5"
    container_name: "atlas-auth-service"
    expose:
      - "8085"
    healthcheck:
      test: "wget -qO- http://localhost:8085/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../services/auth-service/.env
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    extends:
      file: common-config.yml
      service: microservice-base-config

  workspaceservice:
    image: "sumanydv/atlas-workspace-service:v5"
    container_name: "atlas-workspace-service"
    expose:
      - "8090"
    healthcheck:
      test: "wget -qO- http://localhost:8090/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      atlasauthservice:
        condition: service_healthy
    env_file:
      - ../services/workspace-service/.env
    environment:
      AUTH_SERVICE_URL: "http://atlasauthservice:8085"
    extends:
      file: common-config.yml
      service: microservice-base-config

  notificationservice:
    image: "sumanydv/atlas-notification-service:v5"
    container_name: "atlas-notification-service"
    expose:
      - "8095"
    healthcheck:
      test: "wget -qO- http://localhost:8095/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      atlasauthservice:
        condition: service_healthy
    env_file:
      - ../services/notification-service/.env
    environment:
      AUTH_SERVICE_URL: "http://atlasauthservice:8085"
      FIREBASE_CREDENTIALS_PATH: "/app/firebase-service-account.json"
    volumes:
      - ../services/notification-service/firebase-service-account.json:/app/firebase-service-account.json:ro
    extends:
      file: common-config.yml
      service: microservice-base-config

  agentservice:
    image: "sumanydv/atlas-agent-service:v5"
    container_name: "atlas-agent-service"
    expose:
      - "9000"
    healthcheck:
      test: "wget -qO- http://localhost:9000/actuator/health | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      atlasauthservice:
        condition: service_healthy
      workspaceservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
    env_file:
      - ../services/agent-service/.env
    environment:
      AUTH_SERVICE_URL: "http://atlasauthservice:8085"
      WORKSPACE_SERVICE_URL: "http://workspaceservice:8090"
      NOTIFICATION_SERVICE_URL: "http://notificationservice:8095"
    extends:
      file: common-config.yml
      service: microservice-base-config

  apigateway:
    image: "sumanydv/atlas-api-gateway:v5"
    container_name: "atlas-api-gateway"
    ports:
      - "8080:8080"
    depends_on:
      atlasauthservice:
        condition: service_healthy
      workspaceservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
      agentservice:
        condition: service_healthy
    env_file:
      - ../services/api-gateway/.env
    environment:
      AUTH_SERVICE_URL: "http://atlasauthservice:8085"
      WORKSPACE_SERVICE_URL: "http://workspaceservice:8090"
      NOTIFICATION_SERVICE_URL: "http://notificationservice:8095"
      AGENT_SERVICE_URL: "http://agentservice:9000"
    extends:
      file: common-config.yml
      service: microservice-base-config


networks:
  atlas-network:
    driver: bridge
