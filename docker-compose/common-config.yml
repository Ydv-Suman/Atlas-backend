services:
  network-deploy-service:
    networks:
      - atlas-network

  microservice-base-config:
    extends:
      service: network-deploy-service
    deploy:
      resources:
        limits:
          memory: 700m
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
